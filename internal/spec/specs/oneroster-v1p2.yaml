name: OneRoster v1p2
description: 1EdTech OneRoster v1.2 REST bindings (rostering + gradebook + resources)
# v1.2 splits the API into three services, each with its own base path:
#   /ims/oneroster/rostering/v1p2, /gradebook/v1p2 and /resources/v1p2.
# The shared prefix is the basePath; every resource path carries its service.
basePath: /ims/oneroster
idField: sourcedId

paging:
  limitParam: limit
  offsetParam: offset
  defaultLimit: 100

queryParams:
  - name: limit
    description: Max number of records to return
    default: "100"
  - name: offset
    description: Number of records to skip
    default: "0"
  - name: sort
    description: Field to sort by
  - name: orderBy
    description: asc or desc
  - name: filter
    description: "Filter expression, e.g. status='active' AND role='student'"
  - name: fields
    description: Comma-separated list of fields to return

refTypes:
  user: users
  student: students
  teacher: teachers
  org: orgs
  school: schools
  class: classes
  course: courses
  academicSession: academicSessions
  term: terms
  gradingPeriod: gradingPeriods
  enrollment: enrollments
  demographics: demographics
  lineItem: lineItems
  category: categories
  result: results
  scoreScale: scoreScales
  assessmentLineItem: assessmentLineItems
  assessmentResult: assessmentResults
  resource: resources

resources:
  # --- rostering service -------------------------------------------------
  - name: academicSessions
    description: Terms, semesters, grading periods and school years
    listPath: /rostering/v1p2/academicSessions
    itemPath: /rostering/v1p2/academicSessions/{sourcedId}
    listKey: academicSessions
    itemKey: academicSession
    columns: [sourcedId, title, type, startDate, endDate, schoolYear, status]

  - name: terms
    description: Academic sessions of type term
    listPath: /rostering/v1p2/terms
    itemPath: /rostering/v1p2/terms/{sourcedId}
    listKey: academicSessions
    itemKey: academicSession
    columns: [sourcedId, title, type, startDate, endDate, schoolYear, status]
    related:
      - {name: classes, path: "/rostering/v1p2/terms/{sourcedId}/classes", listKey: classes, resource: classes}
      - {name: gradingPeriods, path: "/rostering/v1p2/terms/{sourcedId}/gradingPeriods", listKey: academicSessions, resource: gradingPeriods}

  - name: gradingPeriods
    description: Academic sessions of type gradingPeriod
    listPath: /rostering/v1p2/gradingPeriods
    itemPath: /rostering/v1p2/gradingPeriods/{sourcedId}
    listKey: academicSessions
    itemKey: academicSession
    columns: [sourcedId, title, type, startDate, endDate, schoolYear, status]

  - name: orgs
    description: Organisations (districts, schools, departments)
    listPath: /rostering/v1p2/orgs
    itemPath: /rostering/v1p2/orgs/{sourcedId}
    listKey: orgs
    itemKey: org
    columns: [sourcedId, name, type, identifier, status]

  - name: schools
    description: Organisations of type school
    listPath: /rostering/v1p2/schools
    itemPath: /rostering/v1p2/schools/{sourcedId}
    listKey: orgs
    itemKey: org
    columns: [sourcedId, name, type, identifier, status]
    related:
      - {name: classes, path: "/rostering/v1p2/schools/{sourcedId}/classes", listKey: classes, resource: classes}
      - {name: courses, path: "/rostering/v1p2/schools/{sourcedId}/courses", listKey: courses, resource: courses}
      - {name: enrollments, path: "/rostering/v1p2/schools/{sourcedId}/enrollments", listKey: enrollments, resource: enrollments}
      - {name: students, path: "/rostering/v1p2/schools/{sourcedId}/students", listKey: users, resource: students}
      - {name: teachers, path: "/rostering/v1p2/schools/{sourcedId}/teachers", listKey: users, resource: teachers}
      - {name: terms, path: "/rostering/v1p2/schools/{sourcedId}/terms", listKey: academicSessions, resource: terms}
      - {name: scoreScales, path: "/gradebook/v1p2/schools/{sourcedId}/scoreScales", listKey: scoreScales, resource: scoreScales}

  - name: courses
    description: Courses offered by an org
    listPath: /rostering/v1p2/courses
    itemPath: /rostering/v1p2/courses/{sourcedId}
    listKey: courses
    itemKey: course
    columns: [sourcedId, title, courseCode, schoolYear, level, status]
    related:
      - {name: classes, path: "/rostering/v1p2/courses/{sourcedId}/classes", listKey: classes, resource: classes}
      - {name: resources, path: "/resources/v1p2/courses/{sourcedId}/resources", listKey: resources, resource: resources}

  - name: classes
    description: Class sections (instances of a course)
    listPath: /rostering/v1p2/classes
    itemPath: /rostering/v1p2/classes/{sourcedId}
    listKey: classes
    itemKey: class
    columns: [sourcedId, title, classCode, classType, location, status]
    related:
      - {name: students, path: "/rostering/v1p2/classes/{sourcedId}/students", listKey: users, resource: students}
      - {name: teachers, path: "/rostering/v1p2/classes/{sourcedId}/teachers", listKey: users, resource: teachers}
      - {name: categories, path: "/gradebook/v1p2/classes/{sourcedId}/categories", listKey: categories, resource: categories}
      - {name: lineItems, path: "/gradebook/v1p2/classes/{sourcedId}/lineItems", listKey: lineItems, resource: lineItems}
      - {name: results, path: "/gradebook/v1p2/classes/{sourcedId}/results", listKey: results, resource: results}
      - {name: scoreScales, path: "/gradebook/v1p2/classes/{sourcedId}/scoreScales", listKey: scoreScales, resource: scoreScales}
      - {name: resources, path: "/resources/v1p2/classes/{sourcedId}/resources", listKey: resources, resource: resources}

  - name: users
    description: All users (students, teachers, parents, admins, relatives)
    listPath: /rostering/v1p2/users
    itemPath: /rostering/v1p2/users/{sourcedId}
    listKey: users
    itemKey: user
    columns: [sourcedId, givenName, familyName, username, email, enabledUser, status]
    related:
      - {name: classes, path: "/rostering/v1p2/users/{sourcedId}/classes", listKey: classes, resource: classes}
      - {name: resources, path: "/resources/v1p2/users/{sourcedId}/resources", listKey: resources, resource: resources}

  - name: students
    description: Users with the student role
    listPath: /rostering/v1p2/students
    itemPath: /rostering/v1p2/students/{sourcedId}
    listKey: users
    itemKey: user
    columns: [sourcedId, givenName, familyName, username, email, enabledUser, status]
    related:
      - {name: classes, path: "/rostering/v1p2/students/{sourcedId}/classes", listKey: classes, resource: classes}
      - {name: resources, path: "/resources/v1p2/users/{sourcedId}/resources", listKey: resources, resource: resources}

  - name: teachers
    description: Users with the teacher role
    listPath: /rostering/v1p2/teachers
    itemPath: /rostering/v1p2/teachers/{sourcedId}
    listKey: users
    itemKey: user
    columns: [sourcedId, givenName, familyName, username, email, enabledUser, status]
    related:
      - {name: classes, path: "/rostering/v1p2/teachers/{sourcedId}/classes", listKey: classes, resource: classes}
      - {name: resources, path: "/resources/v1p2/users/{sourcedId}/resources", listKey: resources, resource: resources}

  - name: enrollments
    description: User membership in classes
    listPath: /rostering/v1p2/enrollments
    itemPath: /rostering/v1p2/enrollments/{sourcedId}
    listKey: enrollments
    itemKey: enrollment
    columns: [sourcedId, role, primary, beginDate, endDate, status]

  - name: demographics
    description: Demographic data for users
    listPath: /rostering/v1p2/demographics
    itemPath: /rostering/v1p2/demographics/{sourcedId}
    listKey: demographics
    itemKey: demographics
    columns: [sourcedId, birthDate, sex, status]

  # --- gradebook service -------------------------------------------------
  - name: categories
    description: Gradebook categories (groups of line items)
    listPath: /gradebook/v1p2/categories
    itemPath: /gradebook/v1p2/categories/{sourcedId}
    listKey: categories
    itemKey: category
    columns: [sourcedId, title, weight, status]

  - name: lineItems
    description: Gradebook line items (assignments)
    listPath: /gradebook/v1p2/lineItems
    itemPath: /gradebook/v1p2/lineItems/{sourcedId}
    listKey: lineItems
    itemKey: lineItem
    columns: [sourcedId, title, assignDate, dueDate, resultValueMin, resultValueMax, status]

  - name: results
    description: Gradebook results (scores against a line item)
    listPath: /gradebook/v1p2/results
    itemPath: /gradebook/v1p2/results/{sourcedId}
    listKey: results
    itemKey: result
    columns: [sourcedId, score, textScore, scoreStatus, scoreDate, comment, status]

  - name: scoreScales
    description: Score scales used to grade line items (new in v1.2)
    listPath: /gradebook/v1p2/scoreScales
    itemPath: /gradebook/v1p2/scoreScales/{sourcedId}
    listKey: scoreScales
    itemKey: scoreScale
    columns: [sourcedId, title, type, status]

  - name: assessmentLineItems
    description: Assessment line items (new in v1.2)
    listPath: /gradebook/v1p2/assessmentLineItems
    itemPath: /gradebook/v1p2/assessmentLineItems/{sourcedId}
    listKey: assessmentLineItems
    itemKey: assessmentLineItem
    columns: [sourcedId, title, description, resultValueMin, resultValueMax, status]

  - name: assessmentResults
    description: Assessment results (new in v1.2)
    listPath: /gradebook/v1p2/assessmentResults
    itemPath: /gradebook/v1p2/assessmentResults/{sourcedId}
    listKey: assessmentResults
    itemKey: assessmentResult
    columns: [sourcedId, score, textScore, scoreStatus, scorePercentile, scoreDate, status]

  # --- resources service -------------------------------------------------
  - name: resources
    description: Resources allocated to classes, courses and users
    listPath: /resources/v1p2/resources
    itemPath: /resources/v1p2/resources/{sourcedId}
    listKey: resources
    itemKey: resource
    columns: [sourcedId, title, vendorResourceId, vendorId, applicationId, importance, status]
